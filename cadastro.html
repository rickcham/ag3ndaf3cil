<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — AgendaFácil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos/app.css">
</head>
<body class="pagina-login">

  <a href="index.html" class="login-logo">AgendaFácil</a>

  <main class="login-container">
    <div class="login-card">
      <h1>Criar sua conta</h1>
      <p class="login-subtitulo">Comece a organizar seus agendamentos em minutos.</p>

      <form id="form-cadastro" novalidate>
        <div class="form-grupo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" class="form-input" placeholder="Como quer ser chamado" autocomplete="name">
        </div>

        <div class="form-grupo">
          <label for="email">E-mail</label>
          <input type="email" id="email" class="form-input" placeholder="voce@exemplo.com" autocomplete="email">
        </div>

        <div class="form-grupo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" class="form-input" placeholder="Mínimo de 6 caracteres" autocomplete="new-password">
        </div>

        <div class="form-grupo">
          <label for="confirmar">Confirmar senha</label>
          <input type="password" id="confirmar" class="form-input" placeholder="Repita a senha" autocomplete="new-password">
        </div>

        <p id="mensagem-erro" class="mensagem-erro"></p>

        <button type="submit" class="btn-primario btn-bloco">Criar conta</button>
      </form>

      <p class="login-rodape">
        Já tem conta?
        <a href="login.html" class="link-secundario">Entrar</a>
      </p>
    </div>
  </main>

  <script src="javascript/app.js"></script>
</body>
</html>
