<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — AgendaFácil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos/app.css">
</head>
<body class="pagina-app">

  <div class="app-layout">

    <aside class="sidebar">
      <a href="dashboard.html" class="sidebar-logo">AgendaFácil</a>

      <nav class="sidebar-menu">
        <a href="dashboard.html" class="menu-item">
          <span class="menu-icone">▦</span>
          Dashboard
        </a>
        <a href="agenda.html" class="menu-item">
          <span class="menu-icone">▤</span>
          Agenda
        </a>
        <a href="clientes.html" class="menu-item ativo">
          <span class="menu-icone">◉</span>
          Clientes
        </a>
        <a href="financa.html" class="menu-item">
          <span class="menu-icone">✦</span>
          Finanças
        </a>
        <a href="suporte.html" class="menu-item">
          <span class="menu-icone">◆</span>
          Suporte
        </a>
      </nav>

      <button type="button" class="sidebar-sair" id="btn-sair">Sair</button>
    </aside>

    <div class="app-conteudo">

      <header class="app-header">
        <div>
          <h1 class="app-titulo">Clientes</h1>
          <p class="app-subtitulo">Gerencie sua base de clientes.</p>
        </div>
        <button type="button" class="btn-primario" id="btn-novo">Novo cliente</button>
      </header>

      <main class="app-main">

        <section class="bloco-clientes">

          <div class="busca-container">
            <input type="text" id="busca" class="form-input" placeholder="Buscar por nome, e-mail ou telefone">
          </div>

          <div class="tabela-wrapper">
            <table class="tabela-clientes">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Telefone</th>
                  <th>E-mail</th>
                  <th>Último agendamento</th>
                  <th class="coluna-acoes">Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-corpo">
                <!-- preenchido pelo JavaScript -->
              </tbody>
            </table>

            <p class="estado-vazio" id="estado-vazio" style="display: none;">
              Nenhum cliente cadastrado.
            </p>
          </div>

        </section>

      </main>

    </div>

  </div>

  <!-- MODAL DE CLIENTE -->
  <div class="modal-fundo" id="modal-fundo">
    <div class="modal">
      <header class="modal-cabecalho">
        <h2 id="modal-titulo">Novo cliente</h2>
        <button type="button" class="btn-fechar" id="btn-fechar">✕</button>
      </header>

      <form id="form-cliente" class="modal-form">
        <div class="form-grupo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" class="form-input" placeholder="Ex: Mariana Silva">
        </div>

        <div class="form-grupo">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" class="form-input" placeholder="(11) 91234-5678">
        </div>

        <div class="form-grupo">
          <label for="email">E-mail</label>
          <input type="email" id="email" class="form-input" placeholder="cliente@exemplo.com">
        </div>

        <p id="mensagem-erro-modal" class="mensagem-erro"></p>

        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="btn-cancelar">Cancelar</button>
          <button type="submit" class="btn-primario">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="javascript/app.js"></script>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
</body>
</html>
